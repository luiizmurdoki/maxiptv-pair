<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Max IPTV — Parear TV</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #070A0F; color: #F6F8FC;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px;
  }
  .card { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .brand { color: #FFB020; font-weight: 800; }
  p { color: #93A0B4; font-size: 15px; line-height: 1.5; }
  input {
    width: 100%; padding: 14px 16px; margin: 16px 0 12px; border-radius: 12px;
    border: 1px solid #222A36; background: #0F141C; color: #F6F8FC; font-size: 16px;
  }
  input:focus { outline: none; border-color: #FFB020; }
  button {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: #FFB020; color: #1a1300; font-weight: 700; font-size: 16px;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: #F6F8FC; border: 1px solid #222A36; margin-top: 10px; }
  button:disabled { opacity: 0.5; }
  #statusEl { margin-top: 14px; font-size: 14px; min-height: 20px; }
  #statusEl.ok { color: #34D399; }
  #statusEl.err { color: #ff6b6b; }
  #codeInput { text-transform: lowercase; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="brand">Max IPTV</span> — Parear TV</h1>
    <div id="app"></div>
    <p style="margin-top:28px;font-size:13px;">
      <a href="privacidade.html" style="color:#93A0B4;">Política de Privacidade</a>
      &nbsp;·&nbsp;
      <a href="termos.html" style="color:#93A0B4;">Termos de Uso</a>
    </p>
  </div>

  <script>
    // Credenciais do MESMO Supabase que os apps já usam — apikey pública por
    // natureza (protegida por RLS no banco, não por ser secreta; é a mesma
    // chave que já vem embutida nos dois apps). Login de verdade acontece
    // AQUI, direto com o Supabase — a senha nunca passa pelo relé do ntfy.sh,
    // só o resultado (um token de sessão) é que viaja pra TV. Ver
    // CONTEXTO-PROJETO seção 59.
    var SUPABASE_URL = 'https://onwutxmlzyfvcvyssysx.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_ZbJ7ZnED4Cx8QPv-gFWaGA_3qd6uLEc';

    function qs(name) {
      var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search);
      return m ? decodeURIComponent(m[1]) : null;
    }
    var code = qs('code');
    var modo = qs('modo'); // 'login' (23/08) — ausente/qualquer outro valor = fluxo de sempre (URL da lista)
    var app = document.getElementById('app');

    // Sem ?code= na URL (quem digitou o link à mão em vez de escanear o QR):
    // pede o código mostrado na TV antes de seguir pro formulário.
    if (!code) {
      app.innerHTML =
        '<p>Digite o código de 6 letras/números mostrado na tela da TV:</p>' +
        '<input type="text" id="codeInput" placeholder="ex.: a1b2c3" maxlength="12" autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<button id="codeBtn">Continuar</button>';
      document.getElementById('codeBtn').addEventListener('click', function () {
        var c = (document.getElementById('codeInput').value || '').trim().toLowerCase();
        if (!c) return;
        location.search = '?code=' + encodeURIComponent(c) + (modo ? '&modo=' + encodeURIComponent(modo) : '');
      });
    } else if (modo === 'login') {
      renderLoginForm(code);
    } else {
      renderListForm(code);
    }

    // ---------- Fluxo de sempre: URL da lista IPTV ----------
    function renderListForm(code) {
      app.innerHTML =
        '<p>Cole abaixo a URL completa da sua lista IPTV (o link do tipo <em>...get.php?username=...&amp;password=...</em>) e envie. Ela vai direto pra TV.</p>' +
        '<input type="url" id="urlInput" placeholder="http://seuprovedor.com/get.php?username=...&password=..." autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<button id="sendBtn">Enviar pra TV</button>' +
        '<div id="statusEl"></div>';

      var input = document.getElementById('urlInput');
      var btn = document.getElementById('sendBtn');
      var statusEl = document.getElementById('statusEl');

      btn.addEventListener('click', function () {
        var url = (input.value || '').trim();
        if (!/^https?:\/\/.+/i.test(url)) {
          statusEl.className = 'err';
          statusEl.textContent = 'Cole uma URL válida (começando com http:// ou https://).';
          return;
        }
        btn.disabled = true;
        statusEl.className = '';
        statusEl.textContent = 'Enviando…';
        publicar(code, { kind: 'lista', url: url }, function () {
          btn.disabled = false;
          statusEl.className = 'ok';
          statusEl.textContent = 'Enviado! Pode voltar pra TV — ela vai conectar sozinha.';
        }, function (msg) {
          btn.disabled = false;
          statusEl.className = 'err';
          statusEl.textContent = msg;
        });
      });
    }

    // ---------- Novo (23/08): login direto no celular ----------
    // A senha NUNCA sai deste formulário pro relé — ela vai só pro Supabase,
    // no POST abaixo. O que a TV recebe é o RESULTADO (token de sessão), não a
    // senha. É o mesmo princípio do gerenciador de senhas do celular: ele
    // preenche este formulário normal, como qualquer site.
    function renderLoginForm(code) {
      app.innerHTML =
        '<p>Entra com sua conta Max IPTV. Sua senha fica só aqui — a TV recebe apenas a confirmação de que você entrou.</p>' +
        '<input type="email" id="emailInput" placeholder="e-mail" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="email">' +
        '<input type="password" id="senhaInput" placeholder="senha" autocomplete="current-password">' +
        '<button id="entrarBtn">Entrar</button>' +
        '<button id="criarBtn" class="ghost">Criar conta</button>' +
        '<div id="statusEl"></div>';

      var emailInput = document.getElementById('emailInput');
      var senhaInput = document.getElementById('senhaInput');
      var entrarBtn = document.getElementById('entrarBtn');
      var criarBtn = document.getElementById('criarBtn');
      var statusEl = document.getElementById('statusEl');

      function ambosBotoes(disabled) { entrarBtn.disabled = disabled; criarBtn.disabled = disabled; }

      function autenticar(caminho, sucessoMsg) {
        var email = (emailInput.value || '').trim();
        var senha = senhaInput.value || '';
        if (!email || !senha) {
          statusEl.className = 'err';
          statusEl.textContent = 'Preenche e-mail e senha.';
          return;
        }
        ambosBotoes(true);
        statusEl.className = '';
        statusEl.textContent = 'Um momento…';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', SUPABASE_URL + '/auth/v1' + caminho, true);
        xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onload = function () {
          var d = null;
          try { d = JSON.parse(xhr.responseText); } catch (e) {}
          if (xhr.status >= 200 && xhr.status < 300 && d && d.access_token) {
            // Achou sessão — manda só o TOKEN pra TV, nunca a senha.
            var payload = ({
              kind: 'login',
              access_token: d.access_token,
              refresh_token: d.refresh_token,
              expires_in: d.expires_in,
              uid: d.user && d.user.id
            });
            publicar(code, payload, function () {
              ambosBotoes(false);
              statusEl.className = 'ok';
              statusEl.textContent = sucessoMsg + ' Pode voltar pra TV.';
            }, function (msg) {
              ambosBotoes(false);
              statusEl.className = 'err';
              statusEl.textContent = msg;
            });
          } else {
            ambosBotoes(false);
            statusEl.className = 'err';
            var msg = (d && (d.error_description || d.msg || d.error)) || ('Erro ' + xhr.status);
            if (/already registered|already exists/i.test(msg)) msg = 'Este e-mail já tem cadastro — tenta "Entrar".';
            else if (/invalid login credentials/i.test(msg)) msg = 'E-mail ou senha errados.';
            else if (/password/i.test(msg) && xhr.status === 422) msg = 'A senha precisa ter pelo menos 6 caracteres.';
            else if (!d) msg = 'Cadastro criado — confirme pelo e-mail antes de entrar.';
            statusEl.textContent = msg;
          }
        };
        xhr.onerror = function () {
          ambosBotoes(false);
          statusEl.className = 'err';
          statusEl.textContent = 'Erro de rede. Verifique sua internet e tente de novo.';
        };
        xhr.send(JSON.stringify({ email: email, password: senha }));
      }

      entrarBtn.addEventListener('click', function () { autenticar('/token?grant_type=password', 'Entrou!'); });
      criarBtn.addEventListener('click', function () { autenticar('/signup', 'Conta criada!'); });
    }

    // ---------- Relé PRÓPRIO — compartilhado pelos dois fluxos ----------
    //
    // Trocado em 01/09. Antes isto publicava num tópico PÚBLICO do ntfy.sh, e o
    // que passava por lá era: a URL do provedor (usuário e senha inteiros) no
    // fluxo de lista, e o access_token/refresh_token da conta no fluxo de login.
    // Qualquer pessoa lê um tópico de lá sem autenticação — verificado com curl.
    //
    // Agora vai para uma função nossa, que entrega o conteúdo UMA vez e só para
    // quem tem o segredo — e o segredo nunca sai da TV. Ver a documentação em
    // `MaxIPTVCore/ReleDePareamento.swift`.
    function publicar(code, conteudo, ok, err) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', SUPABASE_URL + '/functions/v1/parear', true);
      xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) { ok(); return; }
        var msg = 'Falha ao enviar (HTTP ' + xhr.status + '). Tente de novo.';
        // O código vale 5 minutos; passar disso é o erro mais provável aqui, e
        // dizer isso poupa a pessoa de tentar de novo com o código velho.
        if (xhr.status === 404) msg = 'Este código expirou. Gere um novo na TV.';
        if (xhr.status === 409) msg = 'Este código já foi usado. Gere um novo na TV.';
        err(msg);
      };
      xhr.onerror = function () { err('Erro de rede. Verifique sua internet e tente de novo.'); };
      xhr.send(JSON.stringify({ acao: 'publicar', codigo: code, conteudo: conteudo }));
    }
  </script>
</body>
</html>
