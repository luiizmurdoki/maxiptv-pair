<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Max IPTV — Parear TV</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #070A0F; color: #F6F8FC;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px;
  }
  .card { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .brand { color: #FFB020; font-weight: 800; }
  p { color: #93A0B4; font-size: 15px; line-height: 1.5; }
  input {
    width: 100%; padding: 14px 16px; margin: 16px 0 12px; border-radius: 12px;
    border: 1px solid #222A36; background: #0F141C; color: #F6F8FC; font-size: 16px;
  }
  input:focus { outline: none; border-color: #FFB020; }
  button {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: #FFB020; color: #1a1300; font-weight: 700; font-size: 16px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  #statusEl { margin-top: 14px; font-size: 14px; min-height: 20px; }
  #statusEl.ok { color: #34D399; }
  #statusEl.err { color: #ff6b6b; }
  #codeInput { text-transform: lowercase; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="brand">Max IPTV</span> — Parear TV</h1>
    <div id="app"></div>
  </div>

  <script>
    function qs(name) {
      var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search);
      return m ? decodeURIComponent(m[1]) : null;
    }
    var code = qs('code');
    var app = document.getElementById('app');

    // Sem ?code= na URL (quem digitou o link à mão em vez de escanear o QR):
    // pede o código mostrado na TV antes de seguir pro formulário.
    if (!code) {
      app.innerHTML =
        '<p>Digite o código de 6 letras/números mostrado na tela da TV:</p>' +
        '<input type="text" id="codeInput" placeholder="ex.: a1b2c3" maxlength="12" autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<button id="codeBtn">Continuar</button>';
      document.getElementById('codeBtn').addEventListener('click', function () {
        var c = (document.getElementById('codeInput').value || '').trim().toLowerCase();
        if (!c) return;
        location.search = '?code=' + encodeURIComponent(c);
      });
    } else {
      renderForm(code);
    }

    function renderForm(code) {
      app.innerHTML =
        '<p>Cole abaixo a URL completa da sua lista IPTV (o link do tipo <em>...get.php?username=...&amp;password=...</em>) e envie. Ela vai direto pra TV.</p>' +
        '<input type="url" id="urlInput" placeholder="http://seuprovedor.com/get.php?username=...&password=..." autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<button id="sendBtn">Enviar pra TV</button>' +
        '<div id="statusEl"></div>';

      var input = document.getElementById('urlInput');
      var btn = document.getElementById('sendBtn');
      var statusEl = document.getElementById('statusEl');

      btn.addEventListener('click', function () {
        var url = (input.value || '').trim();
        if (!/^https?:\/\/.+/i.test(url)) {
          statusEl.className = 'err';
          statusEl.textContent = 'Cole uma URL válida (começando com http:// ou https://).';
          return;
        }
        btn.disabled = true;
        statusEl.className = '';
        statusEl.textContent = 'Enviando…';
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://ntfy.sh/maxiptv-pair-' + encodeURIComponent(code), true);
        xhr.onload = function () {
          btn.disabled = false;
          if (xhr.status >= 200 && xhr.status < 300) {
            statusEl.className = 'ok';
            statusEl.textContent = 'Enviado! Pode voltar pra TV — ela vai conectar sozinha.';
          } else {
            statusEl.className = 'err';
            statusEl.textContent = 'Falha ao enviar (HTTP ' + xhr.status + '). Tente de novo.';
          }
        };
        xhr.onerror = function () {
          btn.disabled = false;
          statusEl.className = 'err';
          statusEl.textContent = 'Erro de rede. Verifique sua internet e tente de novo.';
        };
        xhr.send(url);
      });
    }
  </script>
</body>
</html>
